<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borussia Düsseldorf – Spielkalender TTBL</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="logo-badge">BD</div>
      <div class="header-text">
        <h1>Borussia Düsseldorf</h1>
        <p>Spielplan · Tischtennis-Bundesliga</p>
      </div>
    </div>
  </header>

  <main>
    <section class="countdown-section" aria-live="polite">
      <h2 id="countdown-title">Nächstes Spiel</h2>
      <div id="countdown" class="countdown">
        <div class="countdown-box">
          <span class="countdown-value" id="cd-days">--</span>
          <span class="countdown-label">Tage</span>
        </div>
        <div class="countdown-box">
          <span class="countdown-value" id="cd-hours">--</span>
          <span class="countdown-label">Std</span>
        </div>
        <div class="countdown-box">
          <span class="countdown-value" id="cd-minutes">--</span>
          <span class="countdown-label">Min</span>
        </div>
        <div class="countdown-box">
          <span class="countdown-value" id="cd-seconds">--</span>
          <span class="countdown-label">Sek</span>
        </div>
      </div>
      <p id="next-game-info" class="next-game-info"></p>
    </section>

    <section class="games-section">
      <h2>Alle Spiele</h2>
      <ul class="legend">
        <li><span class="legend-swatch legend-home"></span> Heimspiel</li>
        <li><span class="legend-swatch legend-away"></span> Auswärtsspiel</li>
      </ul>
      <div id="games-list" class="games-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Inoffizielle Fan-Seite · Daten ohne Gewähr</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
