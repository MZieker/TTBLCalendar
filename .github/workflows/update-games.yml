name: Update TTBL games and table

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-games:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch latest games
        run: python scripts/fetch_games.py

      - name: Fetch latest table
        run: python scripts/fetch_table.py

      - name: Generate PDF schedule
        run: python scripts/generate_pdf.py

      - name: Commit and push changes if games.json, table.json or spielplan.pdf changed
        run: |
          if git diff --quiet -- games.json table.json spielplan.pdf; then
            echo "Keine Aenderungen an games.json, table.json oder spielplan.pdf."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games.json table.json spielplan.pdf
          git commit -m "chore: update TTBL games and table"
          git push
